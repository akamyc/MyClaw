description = "MyClaw - AI Assistant powered by AgentScope"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agentscope>=1.0.16",
    "agentscope-runtime>=1.1.0",
    "croniter>=1.0.0",
